services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hrms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    # Password bắt buộc trong production; maxmemory tránh OOM
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
    # KHÔNG expose port ra ngoài — chỉ backend/celery truy cập qua internal network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  garage:
    # Kho tệp ứng dụng và đích sao lưu (kế hoạch 15.7). Ghim theo digest của manifest list đã mirror lên ghcr.
    # Không publish cổng: chỉ backend và celery truy cập qua mạng compose (garage:3900).
    image: ${GARAGE_IMAGE:-dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5}
    restart: always
    command: ["/garage", "server", "--single-node"]
    environment:
      # Bắt buộc đặt trong .env (không có giá trị mặc định): openssl rand -hex 32
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?đặt GARAGE_RPC_SECRET trong .env (openssl rand -hex 32)}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?đặt GARAGE_ADMIN_TOKEN trong .env (openssl rand -hex 32)}
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      # Image không có shell/curl; `garage health -q` thoát 1 khi cụm chưa sẵn sàng (đã chạy được ở Slice 1).
      test: ["CMD", "/garage", "health", "-q"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG}
    restart: always
    command: >
      gunicorn app.main:app
        -w 4
        -k uvicorn.workers.UvicornWorker
        --bind 0.0.0.0:8000
        --timeout 120
        --graceful-timeout 30
        --max-requests 1000
        --max-requests-jitter 100
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hrms}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      REFRESH_TOKEN_COOKIE_SECURE: ${REFRESH_TOKEN_COOKIE_SECURE}
      S3_ENDPOINT: ${S3_ENDPOINT:-${MINIO_ENDPOINT:-}}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ACCESS_KEY:-}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_SECRET_KEY:-}}
      S3_BUCKET: ${S3_BUCKET:-${MINIO_BUCKET:-}}
      S3_SECURE: ${S3_SECURE:-${MINIO_SECURE:-}}
      S3_REGION: ${S3_REGION:-${MINIO_REGION:-garage}}
      BACKUP_STORAGE_ENDPOINT: ${BACKUP_STORAGE_ENDPOINT}
      BACKUP_STORAGE_ACCESS_KEY: ${BACKUP_STORAGE_ACCESS_KEY}
      BACKUP_STORAGE_SECRET_KEY: ${BACKUP_STORAGE_SECRET_KEY}
      BACKUP_STORAGE_REGION: ${BACKUP_STORAGE_REGION:-garage}
      BACKUP_STORAGE_SECURE: ${BACKUP_STORAGE_SECURE:-true}
      BACKUP_STORAGE_BUCKET: ${BACKUP_STORAGE_BUCKET:-hrms-backup}
      BACKUP_TEMP_DIR: ${BACKUP_TEMP_DIR:-/backups/tmp}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-90}
      DB_BACKUP_CRON: ${DB_BACKUP_CRON:-0 2 * * *}
      S3_BACKUP_CRON: ${S3_BACKUP_CRON:-${MINIO_BACKUP_CRON:-0 3 * * *}}
      SOURCE_STORAGE_ENDPOINT: ${SOURCE_STORAGE_ENDPOINT:-${S3_ENDPOINT:-${MINIO_ENDPOINT:-}}}
      SOURCE_STORAGE_ACCESS_KEY: ${SOURCE_STORAGE_ACCESS_KEY:-${S3_ACCESS_KEY:-${MINIO_ACCESS_KEY:-}}}
      SOURCE_STORAGE_SECRET_KEY: ${SOURCE_STORAGE_SECRET_KEY:-${S3_SECRET_KEY:-${MINIO_SECRET_KEY:-}}}
      SOURCE_STORAGE_SECURE: ${SOURCE_STORAGE_SECURE:-${S3_SECURE:-${MINIO_SECURE:-}}}
      BACKUP_NOTIFY_EMAILS: ${BACKUP_NOTIFY_EMAILS:-}
      DEBUG: "false"
      ENVIRONMENT: production
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      SENTRY_DSN: ${SENTRY_DSN:-}
      HEALTHCHECK_PING_URL: ${HEALTHCHECK_PING_URL:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_FULL_NAME: ${BOOTSTRAP_ADMIN_FULL_NAME:-}
    volumes:
      - backup_temp:/backups/tmp
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy

  celery_worker:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG}
    restart: always
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info --concurrency=4 -Q celery,exports,backups
    healthcheck:
      test: ["CMD-SHELL", 'python -c "from pathlib import Path; import sys; cmd=Path(\"/proc/1/cmdline\").read_bytes(); sys.exit(0 if b\"celery\" in cmd and b\"worker\" in cmd else 1)"']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - backup_temp:/backups/tmp
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hrms}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      S3_ENDPOINT: ${S3_ENDPOINT:-${MINIO_ENDPOINT:-}}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ACCESS_KEY:-}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_SECRET_KEY:-}}
      S3_BUCKET: ${S3_BUCKET:-${MINIO_BUCKET:-}}
      S3_SECURE: ${S3_SECURE:-${MINIO_SECURE:-}}
      S3_REGION: ${S3_REGION:-${MINIO_REGION:-garage}}
      BACKUP_STORAGE_ENDPOINT: ${BACKUP_STORAGE_ENDPOINT}
      BACKUP_STORAGE_ACCESS_KEY: ${BACKUP_STORAGE_ACCESS_KEY}
      BACKUP_STORAGE_SECRET_KEY: ${BACKUP_STORAGE_SECRET_KEY}
      BACKUP_STORAGE_REGION: ${BACKUP_STORAGE_REGION:-garage}
      BACKUP_STORAGE_SECURE: ${BACKUP_STORAGE_SECURE:-true}
      BACKUP_STORAGE_BUCKET: ${BACKUP_STORAGE_BUCKET:-hrms-backup}
      BACKUP_TEMP_DIR: ${BACKUP_TEMP_DIR:-/backups/tmp}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-90}
      DB_BACKUP_CRON: ${DB_BACKUP_CRON:-0 2 * * *}
      S3_BACKUP_CRON: ${S3_BACKUP_CRON:-${MINIO_BACKUP_CRON:-0 3 * * *}}
      SOURCE_STORAGE_ENDPOINT: ${SOURCE_STORAGE_ENDPOINT:-${S3_ENDPOINT:-${MINIO_ENDPOINT:-}}}
      SOURCE_STORAGE_ACCESS_KEY: ${SOURCE_STORAGE_ACCESS_KEY:-${S3_ACCESS_KEY:-${MINIO_ACCESS_KEY:-}}}
      SOURCE_STORAGE_SECRET_KEY: ${SOURCE_STORAGE_SECRET_KEY:-${S3_SECRET_KEY:-${MINIO_SECRET_KEY:-}}}
      SOURCE_STORAGE_SECURE: ${SOURCE_STORAGE_SECURE:-${S3_SECURE:-${MINIO_SECURE:-}}}
      BACKUP_NOTIFY_EMAILS: ${BACKUP_NOTIFY_EMAILS:-}
      ENVIRONMENT: production
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy

  celery_beat:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG}
    restart: always
    # RedBeatScheduler: chỉ 1 instance giữ lock Redis — tránh duplicate tasks khi restart
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info --scheduler redbeat.RedBeatScheduler
    healthcheck:
      test: ["CMD-SHELL", 'python -c "from pathlib import Path; import sys; cmd=Path(\"/proc/1/cmdline\").read_bytes(); sys.exit(0 if b\"celery\" in cmd and b\"beat\" in cmd else 1)"']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hrms}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      S3_ENDPOINT: ${S3_ENDPOINT:-${MINIO_ENDPOINT:-}}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ACCESS_KEY:-}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_SECRET_KEY:-}}
      S3_BUCKET: ${S3_BUCKET:-${MINIO_BUCKET:-}}
      S3_SECURE: ${S3_SECURE:-${MINIO_SECURE:-}}
      S3_REGION: ${S3_REGION:-${MINIO_REGION:-garage}}
      ENVIRONMENT: production
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      redis:
        condition: service_started
      celery_worker:
        condition: service_started
      garage:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE}:${IMAGE_TAG}
    restart: always

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro   # Let's Encrypt ACME webroot
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

  # Certbot — tự động renew SSL certificate
  # Chạy riêng: docker compose run --rm certbot
  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./nginx/ssl:/etc/letsencrypt/live
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "certbot certonly --webroot -w /var/www/certbot
             --email \$$CERTBOT_EMAIL --agree-tos --no-eff-email
             -d \$$DOMAIN"
    profiles: ["certbot"]   # chỉ chạy khi gọi trực tiếp

volumes:
  backup_temp:
  garage_meta:
  garage_data:
  postgres_data:
  certbot_www:
